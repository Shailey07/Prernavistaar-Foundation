<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pernnavistaar Foundation — dedicated to youth empowerment, food security, and environmental sustainability across India."
    />
    <meta name="theme-color" content="#0B1B3B" />
    <title>Pernnavistaar Foundation | Empowering Communities</title>
    <script>
      // Inline script to set theme before first paint (avoids flash)
      (function () {
        try {
          var stored = localStorage.getItem('pvf-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
